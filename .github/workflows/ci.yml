name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # next-env.d.ts is gitignored and normally generated by `next build`/`next dev`.
      # It declares CSS-module and image types that tsc needs.
      - name: Generate next-env.d.ts
        run: |
          printf '%s\n' \
            '/// <reference types="next" />' \
            '/// <reference types="next/image-types/global" />' > next-env.d.ts

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      # The repo runs with strict: false, which hides nullability drift between
      # the models and types/database.ts. Check the drift test with strictNullChecks.
      - name: Type-check DB type drift test (strictNullChecks)
        run: npm run typecheck:db-types

      - name: Test
        run: npx vitest run

  db-tests:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Only a boolean reaches the job; the secrets themselves are scoped to the preview step.
      HAS_DEPLOY_SECRETS: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Starts the local Postgres with all migrations applied, then runs pgTAP.
      # No secrets needed, so this runs for fork PRs too.
      - name: Start local database
        id: db-start
        run: npx supabase db start

      - name: Run pgTAP tests
        run: npx supabase test db

      # Runs even when pgTAP fails, but only if the database actually started.
      - name: Check generated database types are current
        if: ${{ !cancelled() && steps.db-start.outcome == 'success' }}
        run: npm run db:types:check

      # Read-only: prints pending production migrations, never applies them.
      # Skipped (not failed) when the deploy secrets are unavailable (fork PRs, or not yet configured).
      - name: Preview production migrations
        if: github.event_name == 'pull_request' && env.HAS_DEPLOY_SECRETS == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if git diff --quiet "origin/$BASE_REF...HEAD" -- supabase/migrations; then
            echo "No migration changes"
            exit 0
          fi
          npx supabase link --project-ref mowmxsorkncjycsomqpn
          if [ ! -s supabase/.temp/pooler-url ]; then
            echo "::error::supabase link did not save the connection pooler URL (supabase/.temp/pooler-url). GitHub runners cannot reach the direct IPv6 database host, so db push would fail."
            for path in config/storage config/database/pooler; do
              status=$(curl -s -o /tmp/probe.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/mowmxsorkncjycsomqpn/$path")
              echo "Management API GET $path -> HTTP $status"
              if [ "$status" != "200" ]; then cat /tmp/probe.json; echo; fi
            done
            exit 1
          fi
          npx supabase db push --dry-run --remote -p "$SUPABASE_DB_PASSWORD"

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Cache miss: download Chromium and install its system dependencies.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Cache hit: the browser is restored, but system packages live outside the cache.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Next's recommended pattern: reuse the build cache, keyed on dependencies and sources.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx', '**/*.css', '!node_modules/**', '!.next/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Built here, with the e2e environment, so the web server step in Playwright only starts it.
      - name: Build app for e2e
        run: npm run e2e:build

      - name: Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
