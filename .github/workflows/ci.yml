name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # next-env.d.ts is gitignored and normally generated by `next build`/`next dev`.
      # It declares CSS-module and image types that tsc needs.
      - name: Generate next-env.d.ts
        run: |
          printf '%s\n' \
            '/// <reference types="next" />' \
            '/// <reference types="next/image-types/global" />' > next-env.d.ts

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

  db-tests:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Starts the local Postgres with all migrations applied, then runs pgTAP.
      # No secrets needed, so this runs for fork PRs too.
      - name: Start local database
        run: npx supabase db start

      - name: Run pgTAP tests
        run: npx supabase test db

      # Read-only: prints pending production migrations, never applies them.
      # Skipped (not failed) when the deploy secrets are unavailable (fork PRs, or not yet configured).
      - name: Preview production migrations
        if: github.event_name == 'pull_request' && env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- supabase/migrations; then
            echo "No migration changes"
            exit 0
          fi
          npx supabase link --project-ref mowmxsorkncjycsomqpn -p "$SUPABASE_DB_PASSWORD"
          npx supabase db push --dry-run -p "$SUPABASE_DB_PASSWORD"
