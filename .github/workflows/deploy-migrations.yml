name: Deploy migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']

permissions:
  contents: read

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_YES: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase link --project-ref mowmxsorkncjycsomqpn
          if [ ! -s supabase/.temp/pooler-url ]; then
            echo "::error::supabase link did not save the connection pooler URL (supabase/.temp/pooler-url). GitHub runners cannot reach the direct IPv6 database host, so db push would fail."
            for path in config/storage config/database/pooler; do
              status=$(curl -s -o /tmp/probe.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/mowmxsorkncjycsomqpn/$path")
              echo "Management API GET $path -> HTTP $status"
              if [ "$status" != "200" ]; then cat /tmp/probe.json; echo; fi
            done
            exit 1
          fi

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --remote -p "$SUPABASE_DB_PASSWORD"
